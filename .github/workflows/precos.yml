name: Atualizar preços

on:
  schedule:
    - cron: "0 9 * * *"   # todo dia às 6h (horário de Brasília)
  workflow_dispatch:
  push:
    paths:
      - produtos.txt
      - robo/**

permissions:
  contents: write

jobs:
  precos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar preços
        run: python robo/precos.py
      - name: Salvar precos.json
        run: |
          git config user.name "robo-precos"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add precos.json
          git diff --cached --quiet || git commit -m "Preços atualizados"
          git push
